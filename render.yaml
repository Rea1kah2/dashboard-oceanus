services:
  - type: web
    name: dashboard-oceanus
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"
